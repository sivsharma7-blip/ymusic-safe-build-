name: YMusic Safe Build

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check project files
        run: |
          echo "Repository checked successfully."
          echo "This is a preparation build only."
          echo "Original APK/source project is required before rebuilding."

      - name: Show repository contents
        run: |
          find . -maxdepth 3 -type f | sort
