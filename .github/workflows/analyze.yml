name: Analyze Original APK

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt apksigner zipalign

      - name: Check APK
        run: |
          test -f 4498_ymusic_arm64.apk
          aapt dump badging 4498_ymusic_arm64.apk > apk-badging.txt
          aapt dump permissions 4498_ymusic_arm64.apk > apk-permissions.txt
          apksigner verify --verbose 4498_ymusic_arm64.apk > apk-signature.txt || true

      - name: Save analysis
        uses: actions/upload-artifact@v4
        with:
          name: original-apk-analysis
          path: |
            apk-badging.txt
            apk-permissions.txt
            apk-signature.txt
